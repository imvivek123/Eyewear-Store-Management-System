version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5000:5000"
    volumes:
      - ./server/database.sqlite:/app/database.sqlite
    environment:
      - JWT_SECRET=your_jwt_secret_key_change_in_production
      - PORT=5000
    networks:
      - eyewear-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - eyewear-network

networks:
  eyewear-network:
    driver: bridge
